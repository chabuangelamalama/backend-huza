$kind: http-request
name: Create Enquiry
order: 2000
method: POST
url: '{{base_url}}/enquiries'
body:
  type: json
  content: |-
    {
      "listing_id": "602d1a2f-699c-4c23-bbae-13c6f4c99c0a",
      "buyer_business_id": "868ef634-06ed-421e-be9c-fa483ff133f4",
      "seller_business_id": "9fd08b7b-103a-468e-bf8c-ceb012bac81e",
      "quantity": 5,
      "unit": "KILOGRAM",
      "unit_price": 189.0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has enquiry_id", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("enquiry_id");
          pm.expect(json.enquiry_id).to.be.a("string").and.not.empty;
      });

      pm.test("listing_id matches request", function () {
          const json = pm.response.json();
          pm.expect(json.listing_id).to.eql("602d1a2f-699c-4c23-bbae-13c6f4c99c0a");
      });

      pm.test("buyer_business_id matches request", function () {
          const json = pm.response.json();
          pm.expect(json.buyer_business_id).to.eql("868ef634-06ed-421e-be9c-fa483ff133f4");
      });

      pm.test("seller_business_id matches request", function () {
          const json = pm.response.json();
          pm.expect(json.seller_business_id).to.eql("9fd08b7b-103a-468e-bf8c-ceb012bac81e");
      });

      pm.test("status field is present", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("status");
          pm.expect(json.status).to.be.a("string").and.not.empty;
      });

      pm.test("quantity matches request", function () {
          const json = pm.response.json();
          pm.expect(Number(json.quantity)).to.eql(5);
      });

      pm.test("unit matches request", function () {
          const json = pm.response.json();
          pm.expect(json.unit).to.eql("KILOGRAM");
      });

      pm.test("unit_price matches request", function () {
          const json = pm.response.json();
          pm.expect(Number(json.unit_price)).to.eql(189);
      });

      pm.test("total_amount equals quantity x unit_price", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("total_amount");
          pm.expect(Number(json.total_amount)).to.eql(
              Number(json.quantity) * Number(json.unit_price)
          );
      });

      const json = pm.response.json();
      if (json.enquiry_id) {
          pm.environment.set("enquiry_id", json.enquiry_id);
      }
